name: Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          # Re-running on an already tagged commit reuses that tag.
          existing=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$existing" ]; then
            version="${existing#v}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              version="1.0.0"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              msg=$(git log -1 --pretty=%B)
              # Bump rules: "#major" or "BREAKING CHANGE" -> major, "#minor" or "feat:" -> minor, else patch.
              if grep -qE '#major|BREAKING CHANGE' <<< "$msg"; then
                major=$((major + 1)); minor=0; patch=0
              elif grep -qE '#minor|^feat(\(.*\))?!?:' <<< "$msg"; then
                minor=$((minor + 1)); patch=0
              else
                patch=$((patch + 1))
              fi
              version="$major.$minor.$patch"
            fi
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (versionCode $code)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; the APK will be signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Prepare artifact
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          out="KaosKaki-${{ steps.version.outputs.tag }}.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KaosKaki ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
